{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
    }
    .reset-container {
        max-width: 400px;
        width: 100%;
        margin: 50px auto;
        background: #111;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
    }
    .reset-container h2 {
        color: #ffcc00;
        text-align: center;
        margin-bottom: 15px;
    }
    .form-control {
        background-color: #222;
        color: white;
        border: 1px solid #444;
        border-radius: 25px;
        padding: 12px;
    }
    .btn-warning {
        border-radius: 25px;
        width: 100%;
        padding: 10px;
        font-weight: bold;
    }
    @media (max-width: 576px) {
        .reset-container { margin: 20px; padding: 20px; }
        .form-control, .btn-warning { font-size: 0.95rem; }
    }
</style>

<div class="d-flex align-items-center justify-content-center min-vh-100 px-3">
    <div class="reset-container">
        <h2><i class="fas fa-unlock-alt"></i> Forgot Password?</h2>
        <p class="text-center">Enter your email and we’ll send you a reset link.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit" class="btn btn-warning mt-3">Send Link</button>
        </form>
    </div>
</div>
{% endblock %}

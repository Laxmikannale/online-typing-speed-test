{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
    }
    .reset-complete {
        max-width: 400px;
        width: 100%;
        background: #111;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
    }
    .reset-complete h2 {
        color: #ffcc00;
        font-size: 1.8rem;
        margin-bottom: 15px;
    }
    .reset-complete p {
        font-size: 1rem;
    }
    .reset-complete a {
        color: #007bff;
        font-weight: bold;
        text-decoration: none;
    }
    .reset-complete a:hover {
        text-decoration: underline;
    }
    @media (max-width: 576px) {
        .reset-complete {
            margin: 20px;
            padding: 20px;
        }
        .reset-complete h2 {
            font-size: 1.5rem;
        }
        .reset-complete p {
            font-size: 0.95rem;
        }
    }
</style>

<div class="d-flex align-items-center justify-content-center min-vh-100 px-3">
    <div class="reset-complete">
        <h2><i class="fas fa-check-circle"></i> Password Reset Successful</h2>
        <p>You can now <a href="{% url 'login' %}">log in</a> with your new password.</p>
    </div>
</div>

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock %}

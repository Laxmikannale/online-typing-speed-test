{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2 style="color: #ffcc00;">Forgot Password?</h2>
    <p>Enter your email and we’ll send a reset link.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit" class="btn btn-warning mt-3">Send Link</button>
    </form>
</div>
{% endblock %}

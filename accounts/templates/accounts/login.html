{% extends 'base.html' %}

{% block content %}
<style>
    body {
        background-color: #0d0d0d;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #f0f0f0;
    }

    .login-container {
        max-width: 400px;
        width: 100%;
        margin: 50px auto;
        background: #1a1a1a;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
    }

    .login-container h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #00d4ff;
        font-size: 2rem;
    }

    .form-control {
        background-color: #2b2b2b;
        color: #f0f0f0;
        border: 1px solid #444;
        border-radius: 25px;
        padding: 12px 15px;
        font-size: 1rem;
        margin-bottom: 15px;
        transition: all 0.3s ease;
    }

    .form-control::placeholder {
        color: #bbb;
    }

    .form-control:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
        outline: none;
        background-color: #2b2b2b;
        color: #f0f0f0;
    }

    .btn-primary {
        background-color: #00d4ff;
        color: #0d0d0d;
        border: none;
        border-radius: 25px;
        padding: 12px;
        font-size: 1rem;
        font-weight: bold;
        width: 100%;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #00a1cc;
        color: #fff;
    }

    a {
        color: #ffcc00;
        font-size: 0.9rem;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    /* Mobile Responsive */
    @media (max-width: 576px) {
        .login-container {
            margin: 20px;
            padding: 20px;
        }

        .login-container h2 {
            font-size: 1.6rem;
        }

        .form-control, .btn-primary {
            font-size: 0.95rem;
            padding: 10px;
        }

        .d-flex {
            flex-direction: column;
            align-items: flex-start !important;
            gap: 8px;
        }
    }
</style>

<div class="d-flex align-items-center justify-content-center min-vh-100 px-3">
    <div class="login-container">
        <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
        <form method="POST" autocomplete="off">
            {% csrf_token %}

            <!-- Dummy field to prevent browser autofill -->
            <input type="text" style="display:none">

            <input type="text" name="username" placeholder="Username" class="form-control" autocomplete="new-username" required>
            <input type="password" name="password" placeholder="Password" class="form-control" autocomplete="new-password" required>

            <div class="d-flex justify-content-between align-items-center mb-3 w-100">
                <a href="{% url 'password_reset' %}">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="text-center mt-3">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</div>

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
{% endblock %}
